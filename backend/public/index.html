<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Assistant</title>
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/quill/quill.core.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/screens.css">
<link rel="stylesheet" href="styles/calendar.css">
<link rel="stylesheet" href="styles/people.css">
<link rel="stylesheet" href="styles/search.css">
<link rel="stylesheet" href="styles/record.css">
<link rel="stylesheet" href="styles/editor.css">
<link rel="stylesheet" href="styles/dashboard.css">
<link rel="stylesheet" href="styles/mobile.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Sidebar">
    <div class="brand">
      <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
      <span class="brand-name">Meeting Assistant</span>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar-brand narrow-only" id="topbarBrand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Meeting Assistant</span></span>
      <div class="search wide-only" role="search">
        <label class="sr-only" for="search">Search meetings, transcripts, or action items</label>
        <span id="searchIcon"></span>
        <input id="search" class="input" type="search" placeholder="Search meetings, transcripts, or action items" autocomplete="off">
        <span class="kbd" aria-hidden="true" id="searchKbd">⌘K</span>
        <div id="searchPanel" class="search-panel" hidden></div>
      </div>
      <button id="searchOpen" class="btn btn-ghost btn-icon-touch narrow-only" type="button" aria-label="Search meetings, transcripts, or action items" aria-haspopup="dialog"></button>
      <button id="recPill" class="rec-pill" type="button" hidden><span class="record-dot" aria-hidden="true"></span><span>Recording</span><span id="recPillTime" class="mono">0:00</span></button>
      <div class="topbar-right">
        <button id="helpButton" class="btn btn-ghost btn-icon-touch" type="button" aria-label="Help" aria-haspopup="menu" aria-expanded="false"></button>
        <button id="avatar" class="avatar avatar-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account"></button>
      </div>
    </header>
    <main id="content" class="content" tabindex="-1"></main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>
<div id="searchOverlay" class="search-overlay" hidden></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="recAnnounce" class="sr-only" role="status" aria-live="assertive"></div>

<script src="vendor/quill/quill.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/api.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/people.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/menu.js"></script>
<script src="js/core/search.js"></script>
<script src="js/core/spellcheck.js"></script>
<script src="js/core/chunkQueue.js"></script>
<script src="js/core/recorder.js"></script>
<script src="js/shell.js"></script>
<script src="js/calendar/model.js"></script>
<script src="js/calendar/dialog.js"></script>
<script src="js/calendar/weekView.js"></script>
<script src="js/calendar/listView.js"></script>
<script src="js/calendar/details.js"></script>
<script src="js/calendar/panel.js"></script>
<script src="js/calendar/controller.js"></script>
<script src="js/calendar/form.js"></script>
<script src="js/calendar/addMeeting.js"></script>
<script src="js/calendar/recordFromCalendar.js"></script>
<script src="js/calendar/sync.js"></script>
<script src="js/dashboard/stats.js"></script>
<script src="js/dashboard/table.js"></script>
<script src="js/dashboard/activity.js"></script>
<script src="js/screens/meetings.js"></script>
<script src="js/screens/upload.js"></script>
<script src="js/screens/processing.js"></script>
<script src="js/review/minutesStore.js"></script>
<script src="js/review/sectionsEditor.js"></script>
<script src="js/review/actionItemsEditor.js"></script>
<script src="js/review/transcriptPanel.js"></script>
<script src="js/review/versions.js"></script>
<script src="js/review/reviewExtras.js"></script>
<script src="js/screens/review.js"></script>
<script src="js/screens/send.js"></script>
<script src="js/screens/actionItems.js"></script>
<script src="js/screens/people.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/screens/record.js"></script>
<script src="js/recordActions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
