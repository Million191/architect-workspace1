<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Meeting Assistant</title>
<link rel="stylesheet" href="/styles/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--color-bg, #f6f7f9); color: var(--color-text, #16181d); font-family: var(--font-sans, system-ui, sans-serif); }
  .card { width: min(400px, 100%); background: var(--color-surface, #fff); border: 1px solid var(--color-border, #e3e6eb); border-radius: 14px; padding: 28px; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 20px; }
  .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--color-accent, #5b5bd6); display: grid; place-items: center; color: #fff; font-size: 14px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .help { margin: 0 0 20px; color: var(--color-text-muted, #5b6270); font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 500; margin: 14px 0 6px; }
  input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--color-border-strong, #c9ced6); border-radius: 8px; background: var(--color-surface, #fff); color: inherit; font: inherit; }
  input:focus { outline: 2px solid var(--color-accent, #5b5bd6); outline-offset: 1px; }
  button { width: 100%; height: 44px; margin-top: 20px; border: 0; border-radius: 8px; background: var(--color-accent, #5b5bd6); color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  .error { min-height: 20px; margin: 12px 0 0; color: var(--color-danger, #b42318); font-size: 14px; }
  .note { margin-top: 16px; font-size: 13px; color: var(--color-text-muted, #5b6270); }
</style>
</head>
<body>
<main class="card" aria-labelledby="title">
  <div class="brand"><span class="logo" aria-hidden="true">MA</span>Meeting Assistant</div>
  <h1 id="title">Sign in</h1>
  <p class="help" id="intro">Sign in to see your meetings.</p>
  <form id="form" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div id="confirmWrap" hidden>
      <label for="confirm">Repeat password</label>
      <input id="confirm" type="password" autocomplete="new-password">
    </div>
    <p class="error" id="error" role="alert"></p>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <p class="note" id="note" hidden></p>
</main>
<script>
(function () {
  var setup = false, form = document.getElementById('form'), error = document.getElementById('error'), submit = document.getElementById('submit');
  // Only a path on this site (never another site) is allowed as the place to return to.
  var next = new URLSearchParams(location.search).get('next') || '/';
  if (!/^\/(?!\/)/.test(next)) next = '/';
  function post(url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { if (!r.ok) throw new Error(b.message || 'Something went wrong. Try again.'); return b; }); });
  }
  fetch('/api/auth/status', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (s) {
    if (s.signedIn) { location.replace(next); return; }
    if (s.setupNeeded) {
      setup = true;
      document.getElementById('title').textContent = 'Create your login';
      document.getElementById('intro').textContent = 'First time here: choose the email and password you’ll use to sign in. Only you will have this login.';
      document.getElementById('confirmWrap').hidden = false;
      document.getElementById('password').setAttribute('autocomplete', 'new-password');
      submit.textContent = 'Create login';
      if (!s.canSetUp) {
        submit.disabled = true;
        var note = document.getElementById('note');
        note.hidden = false;
        note.textContent = 'The login can only be created on the computer that runs Meeting Assistant.';
      }
    }
  }).catch(function () { error.textContent = 'Can’t reach Meeting Assistant. Check that it is running.'; });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    error.textContent = '';
    var email = document.getElementById('email').value.trim(), password = document.getElementById('password').value;
    if (!email || !password) { error.textContent = 'Type your email and password.'; return; }
    if (setup && password !== document.getElementById('confirm').value) { error.textContent = 'The two passwords don’t match.'; return; }
    submit.disabled = true;
    post(setup ? '/api/auth/setup' : '/api/auth/login', { email: email, password: password })
      .then(function () { location.replace(next); })
      .catch(function (err) { error.textContent = err.message; submit.disabled = false; document.getElementById('password').focus(); });
  });
})();
</script>
</body>
</html>
